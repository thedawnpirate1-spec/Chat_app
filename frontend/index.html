<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat">
    <header class="chat__header">
      <h1>Chat</h1>
      <p id="status" class="chat__status">Verbinde ...</p>
    </header>

    <ul id="messages" class="chat__messages"></ul>

    <form id="chat-form" class="chat__form" autocomplete="off">
      <input id="name" type="text" placeholder="Dein Name" maxlength="30" required />
      <input id="message" type="text" placeholder="Nachricht schreiben ..." maxlength="500" required />
      <button type="submit">Senden</button>
    </form>
    <p id="error" class="chat__error" hidden></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
